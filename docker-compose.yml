# ============================================================================
# DevOps Lab Platform
# Docker Compose Configuration
#
# This platform provides the shared DevOps services used by all application
# repositories.
#
# Services:
# - Jenkins
# - SonarQube
# - PostgreSQL (SonarQube)
# - Nexus Repository
# - Tomcat
# ============================================================================

services:

  # --------------------------------------------------------------------------
  # Jenkins
  # --------------------------------------------------------------------------
  jenkins:
    image: custom-jenkins:lts

    build:
      context: ./jenkins
      dockerfile: Dockerfile

    restart: unless-stopped

    group_add:
      - "1001"

    environment:
      DOCKER_BUILDKIT: "1"

    ports:
      - "8080:8080"
      - "50000:50000"

    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./jenkins/kube:/var/jenkins_home/.kube:ro

    depends_on:
      - sonarqube
      - nexus

    networks:
      - devops-platform

  # --------------------------------------------------------------------------
  # SonarQube
  # --------------------------------------------------------------------------
  sonarqube:
    image: sonarqube:lts-community

    restart: unless-stopped

    ports:
      - "9000:9000"

    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-postgres:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: Password@123

    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions

    depends_on:
      - sonar-postgres

    networks:
      - devops-platform

  # --------------------------------------------------------------------------
  # PostgreSQL (SonarQube Database)
  # --------------------------------------------------------------------------
  sonar-postgres:
    image: postgres:16

    restart: unless-stopped

    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: Password@123

    volumes:
      - sonar_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - devops-platform

  # --------------------------------------------------------------------------
  # Nexus Repository
  # --------------------------------------------------------------------------
  nexus:
    image: sonatype/nexus3

    restart: unless-stopped

    ports:
      - "8081:8081"
      - "8082:8082"
      - "8083:8083"

    volumes:
      - nexus_data:/nexus-data

    networks:
      - devops-platform

  # --------------------------------------------------------------------------
  # Tomcat
  # --------------------------------------------------------------------------
  tomcat:
    image: tomcat:10.1-jdk17

    restart: unless-stopped

    ports:
      - "9090:8080"

    volumes:
      - tomcat_webapps:/usr/local/tomcat/webapps

    networks:
      - devops-platform


# ============================================================================
# Persistent Volumes
# ============================================================================

volumes:

  jenkins_home:

  sonar_postgres_data:

  sonarqube_data:

  sonarqube_logs:

  sonarqube_extensions:

  nexus_data:

  tomcat_webapps:


# ============================================================================
# Networks
# ============================================================================

networks:

  devops-platform:
    driver: bridge
